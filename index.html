<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fırat Öğrenci Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 h-screen flex flex-col relative transition-colors duration-300">
    <!-- Üst Menü -->
    <header class="bg-red-900 text-white p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-bold">Fırat Asistan (Gemma 4)</h1>
        <div class="flex items-center gap-4">
            <button id="theme-toggle-btn" class="text-xl hover:opacity-80 transition-opacity" title="Gece/Gündüz Modu">🌙</button>
            <button id="clear-chat-btn" class="text-white hover:text-gray-300 text-sm flex items-center gap-1" title="Sohbet Geçmişini Sil">🗑️ Temizle</button>
            <span id="user-profile" class="text-sm font-semibold border-l border-red-700 pl-4">Misafir Öğrenci</span>
            <button id="open-profile-btn" class="bg-white dark:bg-gray-800 dark:text-white text-red-900 px-3 py-1 rounded text-sm hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Profili Düzenle</button>
        </div>
    </header>

    <!-- Profil Modal -->
    <div id="profile-modal" class="hidden absolute inset-0 bg-black bg-opacity-50 z-50 flex justify-center items-center">
        <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg w-96 transition-colors duration-300">
            <h2 class="text-xl font-bold text-red-900 dark:text-red-400 mb-4">Öğrenci Profili</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-sm text-gray-700 dark:text-gray-300">Ad Soyad</label>
                    <input type="text" id="user-name" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-2 focus:ring-red-900" placeholder="Örn: Eyyüp Buğra Kahve">
                </div>
                <div>
                    <label class="block text-sm text-gray-700 dark:text-gray-300">Bölüm</label>
                    <select id="user-dept" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-2 focus:ring-red-900">
                        <option value="Bilgisayar Mühendisliği">Bilgisayar Mühendisliği</option>
                        <option value="Yazılım Mühendisliği">Yazılım Mühendisliği</option>
                        <option value="Tıp Fakültesi">Tıp Fakültesi</option>
                        <option value="Eğitim Fakültesi">Eğitim Fakültesi</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-gray-700 dark:text-gray-300">İlgi Alanları</label>
                    <input type="text" id="user-interests" class="w-full border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded p-2 focus:ring-red-900" placeholder="Örn: Yapay Zeka">
                </div>
            </div>
            <div class="mt-5 flex justify-end gap-2">
                <button id="close-profile-btn" class="px-4 py-2 text-gray-600 dark:text-gray-300 bg-gray-200 dark:bg-gray-700 rounded hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">İptal</button>
                <button id="save-profile-btn" class="px-4 py-2 text-white bg-red-900 dark:bg-red-800 rounded hover:bg-red-800 transition-colors">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Ana İçerik -->
    <main class="flex-1 flex overflow-hidden">
        <section id="chat-section" class="w-full md:w-2/3 flex flex-col border-r border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 transition-colors duration-300">
            <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4">
                <div class="bg-gray-100 dark:bg-gray-700 dark:text-white p-3 rounded-lg max-w-sm transition-colors duration-300">
                    Merhaba! Ben Fırat Asistan. Sana yönetmelikler, kulüpler veya hocalar hakkında nasıl yardımcı olabilirim?
                </div>
            </div>
            
            <div class="px-4 pb-2 flex gap-2 overflow-x-auto text-xs whitespace-nowrap">
                <button onclick="sendQuickMessage('Devamsızlık hakkım yüzde kaç?')" class="bg-gray-100 dark:bg-gray-700 dark:text-gray-200 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 px-3 py-1 rounded-full border border-gray-300 transition-colors">📖 Yönetmelik Sor</button>
                <button onclick="sendQuickMessage('Yapay zeka ile ilgili hangi kulübe katılabilirim?')" class="bg-gray-100 dark:bg-gray-700 dark:text-gray-200 dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 px-3 py-1 rounded-full border border-gray-300 transition-colors">🎯 Kulüp Öner</button>
            </div>

            <div class="p-4 border-t border-gray-200 dark:border-gray-700 flex gap-2">
                <input type="text" id="chat-input" class="flex-1 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-red-900 transition-colors duration-300" placeholder="Sorunu buraya yaz...">
                <button id="send-btn" class="bg-red-900 dark:bg-red-800 text-white px-4 py-2 rounded-lg hover:bg-red-800 transition-colors">Gönder</button>
            </div>
        </section>

        <section id="info-section" class="hidden md:block w-1/3 p-4 bg-gray-50 dark:bg-gray-900 overflow-y-auto transition-colors duration-300">
            <h2 class="font-bold text-lg text-gray-700 dark:text-gray-300 border-b dark:border-gray-700 pb-2 mb-4">Bilgi Paneli</h2>
            <div id="cards-container" class="space-y-4">
                <p class="text-sm text-gray-500 dark:text-gray-400">Sorduğun soruya göre ekstra bilgiler burada listelenecek.</p>
            </div>
        </section>
    </main>

    <script>
        // A'nın yeni IP adresi ve gerçek API açık!
        const API_BASE_URL = 'http://192.168.222.214:8000'; 
        let USE_REAL_API = true; 

        window.sendQuickMessage = function(text) {
            const input = document.getElementById('chat-input');
            const btn = document.getElementById('send-btn');
            if(input && btn) {
                input.value = text;
                btn.click();
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            
            // Gece Modu
            const themeToggleBtn = document.getElementById('theme-toggle-btn');
            if (localStorage.getItem('firatTheme') === 'dark') {
                document.documentElement.classList.add('dark');
                themeToggleBtn.innerText = '☀️';
            }

            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('firatTheme', 'light');
                    themeToggleBtn.innerText = '🌙';
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('firatTheme', 'dark');
                    themeToggleBtn.innerText = '☀️';
                }
            });

            // Değişkenler
            const profileModal = document.getElementById('profile-modal');
            const openProfileBtn = document.getElementById('open-profile-btn');
            const closeProfileBtn = document.getElementById('close-profile-btn');
            const saveProfileBtn = document.getElementById('save-profile-btn');
            const userProfileText = document.getElementById('user-profile');
            const userNameInput = document.getElementById('user-name');
            const userDeptInput = document.getElementById('user-dept');
            
            const chatBox = document.getElementById('chat-box');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const cardsContainer = document.getElementById('cards-container');
            const clearChatBtn = document.getElementById('clear-chat-btn');

            // Hafıza İşlemleri
            const savedHistory = JSON.parse(localStorage.getItem('firatChatHistory') || '[]');
            savedHistory.forEach(msg => addMessage(msg.text, msg.isUser, false));

            clearChatBtn.addEventListener('click', () => {
                if(confirm("Sohbet geçmişini silmek istediğinize emin misiniz?")) {
                    localStorage.removeItem('firatChatHistory');
                    chatBox.innerHTML = `
                        <div class="bg-gray-100 dark:bg-gray-700 dark:text-white p-3 rounded-lg max-w-sm transition-colors duration-300">
                            Merhaba! Ben Fırat Asistan. Sana yönetmelikler, kulüpler veya hocalar hakkında nasıl yardımcı olabilirim?
                        </div>
                    `;
                    cardsContainer.innerHTML = '<p class="text-sm text-gray-500 dark:text-gray-400">Sorduğun soruya göre hoca, kulüp veya menü bilgileri burada listelenecek.</p>';
                }
            });

            openProfileBtn.addEventListener('click', () => profileModal.classList.remove('hidden'));
            closeProfileBtn.addEventListener('click', () => profileModal.classList.add('hidden'));
            saveProfileBtn.addEventListener('click', () => {
                const name = userNameInput.value.trim();
                if(name) userProfileText.innerText = name + " (" + userDeptInput.value + ")";
                profileModal.classList.add('hidden');
            });

            function addMessage(text, isUser = false, saveToStorage = true) {
                const msgDiv = document.createElement('div');
                msgDiv.className = `p-3 rounded-lg max-w-[80%] transition-colors duration-300 ${isUser ? 'bg-red-900 text-white self-end ml-auto' : 'bg-gray-100 dark:bg-gray-700 dark:text-white text-gray-800'}`;
                msgDiv.innerHTML = `<p>${text}</p>`;
                chatBox.appendChild(msgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                if (saveToStorage) {
                    const history = JSON.parse(localStorage.getItem('firatChatHistory') || '[]');
                    history.push({ text, isUser });
                    localStorage.setItem('firatChatHistory', JSON.stringify(history));
                }
            }

            async function handleSend() {
                const text = chatInput.value.trim();
                if (!text) return;

                addMessage(text, true); 
                chatInput.value = '';

                const loadingId = 'loading-' + Date.now();
                const loadingDiv = document.createElement('div');
                loadingDiv.id = loadingId;
                loadingDiv.className = 'bg-gray-100 dark:bg-gray-700 dark:text-white p-3 rounded-lg max-w-sm text-gray-500 text-sm flex gap-1 items-center transition-colors duration-300';
                loadingDiv.innerHTML = `
                    <span class="animate-pulse bg-gray-400 h-2 w-2 rounded-full"></span>
                    <span class="animate-pulse bg-gray-400 h-2 w-2 rounded-full animation-delay-200"></span>
                    <span class="animate-pulse bg-gray-400 h-2 w-2 rounded-full animation-delay-400"></span>
                    <span class="ml-2 italic text-gray-500 dark:text-gray-300">Gemma 4 yanıtlıyor...</span>
                `;
                chatBox.appendChild(loadingDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                let botCevabi = "";

                if (USE_REAL_API) {
                    try {
                        const res = await fetch(`${API_BASE_URL}/api/ask`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ question: text }) 
                        });
                        const data = await res.json();
                        botCevabi = data.answer; 
                        
                        if (data.sources && data.sources.length > 0) {
                            botCevabi += `<br><br><small class="text-xs text-gray-500 dark:text-gray-400">Kaynak: ${data.sources}</small>`;
                        }

                        cardsContainer.innerHTML = '<p class="text-sm text-gray-500 dark:text-gray-400">API bağlandı, cevap backend üzerinden geldi!</p>';

                    } catch (error) {
                        botCevabi = "API'ye bağlanılamadı. CORS ayarlarını veya A'nın IP adresini kontrol edin.";
                    }
                }

                document.getElementById(loadingId)?.remove();
                addMessage(botCevabi, false);
            }

            sendBtn.addEventListener('click', handleSend);
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSend();
            });
        });
    </script>
</body>
</html>
